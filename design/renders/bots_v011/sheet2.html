<!doctype html>
<html><head><meta charset="utf-8"><style>
  :root { --bg: #ffffff; --tx: #111112; --tx2: rgba(0, 4, 9, 0.56); }
  body.black { --bg: #000000; --tx: #f4f4f5; --tx2: rgba(244, 244, 245, 0.6); }
  body { margin: 0; background: var(--bg); color: var(--tx); font-family: -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; }
  h1 { margin: 40px 56px 0; font-size: 15px; font-weight: 500; color: var(--tx2); letter-spacing: 0.01em; }
  .sheet { display: flex; gap: 12px; padding: 24px 56px 52px; }
  .bot { width: 300px; text-align: center; }
  .bot .img { width: 300px; height: 300px; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .name { margin-top: 4px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .role { margin-top: 3px; font-size: 14px; color: var(--tx2); }
  /* The team's Builder is the original blue one (bots_v009). */
  .img.builder { background-image: url(../bots_v009/idle_white/frame_0001.png); }
  body.black .img.builder { background-image: url(sheet_assets/builder_v009.png); }
</style></head><body>
<h1>CraftHQ bot team</h1>
<div class="sheet">
  <div class="bot"><div class="img" style="background-image:url(out/pm.png)"></div><div class="name">PM</div><div class="role">Answers you, assigns the work</div></div>
  <div class="bot"><div class="img builder"></div><div class="name">Builder</div><div class="role">Engineering</div></div>
  <div class="bot"><div class="img" style="background-image:url(out/designer.png)"></div><div class="name">Designer</div><div class="role">Designs the screens</div></div>
  <div class="bot"><div class="img" style="background-image:url(out/checker.png)"></div><div class="name">Checker</div><div class="role">Tests the work</div></div>
  <div class="bot"><div class="img" style="background-image:url(out/fixer.png)"></div><div class="name">Fixer</div><div class="role">Retries failed builds</div></div>
</div>
<script>if (location.hash === "#black") document.body.classList.add("black");</script>
</body></html>
